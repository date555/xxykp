<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>向咸鱼开炮 · 原版动画校验</title><link rel="stylesheet" href="style.css"><style>
html{overflow:auto}body{height:auto;overflow:auto;background:#e3c7a1}body>main{margin:auto}.field-card .canvas-wrap{position:relative;inset:auto;width:100%;height:auto;aspect-ratio:1200/570}.field-card canvas{width:100%;height:100%;display:block}.settings-actions{align-items:center}.settings-actions label{font-size:13px}.preview-embed{padding:0!important;background:#e3c7a1}.preview-embed .page-title,.preview-embed #hero-label,.preview-embed #appearance-label,.preview-embed #toy-label,.preview-embed #boss-label,.preview-embed .settings-actions>label:first-child,.preview-embed #status,.preview-embed #phase,.preview-embed #reference,.preview-embed #moments,.preview-embed details{display:none!important}.preview-embed .settings-actions{margin:0 0 10px;gap:12px}.preview-embed .settings-actions .ui-button{font-size:13px;min-height:37px}.preview-embed #mode-label{margin-right:auto}.preview-embed #mode{min-height:35px;padding:5px 12px}
</style></head>
<body style="padding:24px"><main style="max-width:1250px"><div class="page-title"><div><div class="eyebrow">ASSET CHECK / 原版资源校验</div><h1>武将、皮肤与首领</h1><p>原版动画实播；此页面不读取或修改游戏存档。</p></div><a href="./">返回游戏</a></div>
<div class="settings-actions"><label>演示内容 <select id="kind" aria-label="演示内容"><option value="hero">武将动作</option><option value="toy">玩具技能</option><option value="boss">首领动作</option></select></label><label id="hero-label">武将 <select id="hero" aria-label="演示武将"></select></label><label id="appearance-label">外观 <select id="appearance" aria-label="演示外观"></select></label><label id="mode-label">动作 <select id="mode" aria-label="演示动作"><option value="attack">普攻</option><option value="skill">技能</option></select></label><label id="toy-label" hidden>玩具 <select id="toy" aria-label="演示玩具"></select></label><label id="boss-label" hidden>首领 <select id="boss" aria-label="演示首领"></select></label><button id="replay" class="ui-button small green">重新播放</button><button id="pause" class="ui-button small brown">暂停演示</button></div>
<div id="moments" class="settings-actions"><button id="cast-frame" class="link-button">查看释放动画</button><button id="hit-frame" class="link-button">查看生效瞬间</button><button id="status-frame" class="link-button">查看持续效果</button></div>
<p id="status">正在载入当前演示资源…</p><p id="phase" class="detail-desc"></p><div class="field-card"><div class="canvas-wrap"><canvas id="demo"></canvas></div></div><p id="reference" class="detail-desc"></p>
<details><summary>全部资源校验</summary><p>逐组解析所有皮肤、首领和特效，完成后释放缓存。不会修改存档。</p><button id="verify" class="ui-button small green">校验全部动画</button><pre id="verification" style="white-space:pre-wrap"></pre></details></main>
<script type="module">
import {HEROES,TOYS,BOSSES} from './src/data.js';import {APPEARANCES,APPEARANCE_COUNT} from './src/appearances.js';import {stats,Camp} from './src/model.js';import {Battle} from './src/battle.js';import {Renderer,preload} from './src/renderer.js';import {loadAnimations,verifyAllAnimations} from './src/spine-runtime.js';import {animationFor,TOY_ANIMATIONS,BOSS_ANIMATIONS} from './src/animation-data.js';
const $=s=>document.querySelector(s),hero=$('#hero'),mode=$('#mode'),kind=$('#kind'),toy=$('#toy'),appearance=$('#appearance'),boss=$('#boss'),status=$('#status');
hero.innerHTML=HEROES.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');toy.innerHTML=TOYS.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');boss.innerHTML=BOSSES.filter(b=>BOSS_ANIMATIONS[b.bossKey]).map(b=>`<option value="${b.bossKey}">${b.name}</option>`).join('');
const params=new URLSearchParams(location.search);if(params.has('embed'))document.body.classList.add('preview-embed');if(HEROES.some(h=>h.id===params.get('hero')))hero.value=params.get('hero');
function appearances(){appearance.innerHTML=APPEARANCES[hero.value].map(a=>`<option value="${a.id}">${a.name}</option>`).join('');}
appearances();if(APPEARANCES[hero.value].some(a=>a.id===params.get('appearance')))appearance.value=params.get('appearance');
let b,elapsed=0,last=0,ready=false,playing=true,loading=false;const r=new Renderer($('#demo'),()=>{});
function heroStats(){return stats(hero.value,{level:1,star:0,appearance:appearance.value});}
function reset(){if(!ready)return;const isToy=kind.value==='toy',isBoss=kind.value==='boss';const part=isToy?new Camp().snapshot():isBoss?[null,null,null,null,null]:[null,null,heroStats(),null,null];b=new Battle(part);b.spawned=b.config.count;b.base=45;
 if(isBoss){b.config={...b.config,boss:BOSSES.find(v=>v.bossKey===boss.value)};b.bossSpawned=true;b.spawn(null,true);Object.assign(b.enemies[0],{x:850,y:340,speed:0,hp:1e8,maxHp:1e8,special:1});$('#reference').textContent=`原版首领骨骼：${BOSS_ANIMATIONS[boss.value].body}；面向左侧进攻营地。`;}
 else{for(let i=0;i<(isToy?6:1);i++){b.spawn('shield');Object.assign(b.enemies.at(-1),{x:isToy?630+(i%3)*180:850,y:isToy?195+Math.floor(i/3)*225:300,speed:0,hp:1e8,maxHp:1e8});}
 if(isToy){for(const h of b.party)h.cooldown=999;b.useToy(toy.value);const m=TOY_ANIMATIONS[toy.value];$('#reference').textContent=`WeaponConf #${m.weaponId} → BulletConf #${m.bullet.id} → EffectConf #${m.effect.id} → ${m.asset}；生效 ${(m.hitTime/m.speed).toFixed(2)} 秒。`;}
 else{b.party[2].hits=mode.value==='skill'?4:0;const m=animationFor(b.party[2])[mode.value];$('#reference').textContent=`AvatarConf #${b.party[2].avatarId} → BulletConf #${m.bullet.id} (${m.type}) → EffectConf #${m.effect.id} → ${m.asset}；命中：${m.hitAsset||'包含于主特效'}`;}}elapsed=0;}
function play(){playing=true;if(b)b.paused=false;$('#pause').textContent='暂停演示';}
function step(dt){b.update(dt);elapsed+=dt;if(kind.value==='hero'&&b.party[2].hits>(mode.value==='skill'?4:0))b.party[2].cooldown=999;}
function lockControls(value){document.querySelectorAll('select,button').forEach(el=>el.disabled=value);}
async function prepare(){if(loading)return;loading=true;lockControls(true);ready=false;b=null;status.textContent='正在载入当前演示资源…';$('#hero-label').hidden=$('#appearance-label').hidden=$('#mode-label').hidden=kind.value!=='hero';$('#toy-label').hidden=kind.value!=='toy';$('#boss-label').hidden=kind.value!=='boss';$('#moments').hidden=kind.value==='boss';try{const n=await loadAnimations(kind.value==='toy'?new Camp().snapshot():kind.value==='hero'?[heroStats()]:[],kind.value==='boss'?[boss.value]:[]);ready=true;status.textContent=`当前动画就绪：${n} 组骨骼。内容库：${HEROES.length} 位武将、${APPEARANCE_COUNT} 套外观、${BOSSES.length} 位首领。`;play();reset();}catch(e){status.textContent='校验失败：'+e.message;}finally{loading=false;lockControls(false);}}
function moment(offset){if(!ready)return;reset();let target;if(kind.value==='toy'){const m=TOY_ANIMATIONS[toy.value];target=Math.max(.1,m.hitTime/m.speed+offset);}else{for(let i=0;i<400&&!b.projectiles.length;i++)step(.01);const p=b.projectiles[0];if(!p)return;target=elapsed+Math.max(0,p.delay+p.flight+offset-p.age);}while(elapsed<target)step(Math.min(.01,target-elapsed));playing=false;b.paused=true;$('#pause').textContent='继续演示';}
hero.addEventListener('change',()=>{appearances();prepare();});for(const el of [appearance,kind,boss])el.addEventListener('change',prepare);for(const el of [mode,toy])el.addEventListener('change',()=>{play();reset();});$('#replay').onclick=()=>{play();reset();};$('#pause').onclick=()=>{if(!b)return;playing=!playing;b.paused=!playing;$('#pause').textContent=playing?'暂停演示':'继续演示';};$('#cast-frame').onclick=()=>moment(-.25);$('#hit-frame').onclick=()=>moment(.08);$('#status-frame').onclick=()=>moment(.7);
$('#verify').onclick=async()=>{if(loading)return;loading=true;ready=false;b=null;lockControls(true);try{const result=await verifyAllAnimations(p=>{$('#verification').textContent=`已解析 ${p.passed} / ${p.total}；失败 ${p.failures.length}`;});$('#verification').textContent=JSON.stringify(result,null,2);}catch(e){$('#verification').textContent='校验中断：'+e.message;}finally{loading=false;lockControls(false);}await prepare();};
await preload();await prepare();
function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(b&&ready){if(playing){if(elapsed>(kind.value==='toy'?8:kind.value==='boss'?10:5))reset();step(dt);}r.draw(b,[],0,t/1000);$('#phase').textContent=`${playing?'播放中':'已暂停'} · ${elapsed.toFixed(2)} 秒 · 营地耐久 ${Math.round(b.base)} / ${b.maxBase} · 冰冻敌人 ${b.enemies.filter(e=>e.freeze>0).length} · 加速剩余 ${b.hasteTime.toFixed(1)} 秒`;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
